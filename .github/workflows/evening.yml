name: Evening evaluation

on:
  schedule:
    # 21:30 UTC = 00:30 МСК следующего дня, все дни.
    # По будням ловим полный день, включая вечерку (19:05-23:50).
    # По сб-вс ловим одноразовую сессию 09:00-19:00.
    - cron: "30 21 * * *"
  workflow_dispatch:

concurrency:
  group: evening-evaluation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt

      # Сначала дособрать пост-открытие новости (важно для attribution)
      - name: Collect intraday news
        run: python -X utf8 -m finance.collect --hours 12 --no-tickers

      - name: Evaluate today's briefing
        run: python -X utf8 -m finance.evaluate

      - name: Commit updated DB
        run: |
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions Bot"
          git add data/finance.db
          if git diff --cached --quiet; then
            echo "БД не изменилась."
          else
            git commit -m "chore(eval): evening evaluation [skip ci]"
            git push
          fi

      - name: Upload evening report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evening-${{ github.run_id }}
          path: output/evening_*.md
          retention-days: 30
